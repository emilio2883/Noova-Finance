name: noova_finance
description: "Noova Finance — Personal finance app. Offline-first, dark mode, USD/PAB."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Local database (offline-first)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # Charts
  fl_chart: ^0.69.2

  # Excel I/O
  excel: ^2.1.0
  syncfusion_flutter_xlsio: ^27.2.5

  # Security
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.2

  # Notifications
  flutter_local_notifications: ^17.2.4

  # Utilities
  intl: ^0.19.0
  decimal: ^3.0.2
  file_picker: ^8.1.6
  go_router: ^14.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Isar code generation
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1

flutter:
  uses-material-design: true
