name: Release APK

# Automático: cada push a main compila, sube el versionCode solo y publica
# un release nuevo. Obtainium en el teléfono lo detecta y actualiza.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Compute next version
        id: ver
        run: |
          latest=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          if [ -z "$latest" ]; then
            base=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
            major=$(echo "$base" | cut -d. -f1); minor=$(echo "$base" | cut -d. -f2); patch=$(echo "$base" | cut -d. -f3)
          else
            v=${latest#v}; major=$(echo "$v" | cut -d. -f1); minor=$(echo "$v" | cut -d. -f2); patch=$(echo "$v" | cut -d. -f3)
          fi
          next="${major}.${minor}.$((patch+1))"
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next version: v$next"

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.ver.outputs.next }}
          --build-number=${{ github.run_number }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.next }}
          name: "v${{ steps.ver.outputs.next }}"
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
